<!-- @dsCard group="Colors" viewport="700x150" name="Signal — Readiness lights" subtitle="GO / CAUTION / HOLD traffic-light palette" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: #000; padding: 22px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; height: 96px; border-radius: var(--radius-md); display: flex; flex-direction: column; justify-content: space-between; padding: 12px; border: 1px solid; }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; }
  .hex { font-family: var(--font-body); font-size: 11px; color: rgba(255,255,255,0.6); letter-spacing: 0.04em; }
  .dot { font-size: 22px; }
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="border-color: rgba(0,255,204,0.4)"><span class="dot">🟢</span><div><span class="name" style="color:#00ffcc">GO</span><br><span class="hex">#00FFCC · --signal-go</span></div></div>
  <div class="sw" style="border-color: rgba(255,213,79,0.4)"><span class="dot">🟡</span><div><span class="name" style="color:#ffd54f">CAUTION</span><br><span class="hex">#FFD54F · --signal-caution</span></div></div>
  <div class="sw" style="border-color: rgba(255,92,92,0.4)"><span class="dot">🔴</span><div><span class="name" style="color:#ff5c5c">HOLD</span><br><span class="hex">#FF5C5C · --signal-stop</span></div></div>
</div>
</body>
</html>
