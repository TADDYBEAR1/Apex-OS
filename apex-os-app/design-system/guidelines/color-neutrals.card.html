<!-- @dsCard group="Colors" viewport="700x160" name="Neutrals & text" subtitle="Black canvas, white-alpha text ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: #000; padding: 22px; }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; height: 110px; border-radius: var(--radius-sm); display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; border: 1px solid var(--surface-border); }
  .name { font-family: var(--font-display); font-weight: 600; font-size: 11px; }
  .hex { font-family: var(--font-body); font-size: 10px; letter-spacing: 0.03em; opacity: 0.7; }
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="background:#000"><span class="name" style="color:#fff">BG</span><span class="hex" style="color:#fff">#000000</span></div>
  <div class="sw" style="background:#0a0a0a"><span class="name" style="color:#fff">Sheet</span><span class="hex" style="color:#fff">rgba 10,10,10</span></div>
  <div class="sw" style="background:#27272a"><span class="name" style="color:#fff">Muted Dk</span><span class="hex" style="color:#fff">#27272A</span></div>
  <div class="sw" style="background:#52525b"><span class="name" style="color:#fff">Muted</span><span class="hex" style="color:#fff">#52525B</span></div>
  <div class="sw" style="background:#a1a1aa"><span class="name" style="color:#000">Secondary</span><span class="hex" style="color:#000">#A1A1AA</span></div>
  <div class="sw" style="background:#fff"><span class="name" style="color:#000">Text</span><span class="hex" style="color:#000">#FFFFFF</span></div>
</div>
</body>
</html>
