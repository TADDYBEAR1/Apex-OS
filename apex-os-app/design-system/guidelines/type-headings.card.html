<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: #000; padding: 24px; }
  .meta { font-family: var(--font-body); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .stack > div { padding: 6px 0; }
</style>
</head>
<body>
<div class="stack">
  <div><span class="meta">Display / 40 / 300</span><br><span style="font-family:var(--font-display); font-weight:300; font-size:40px; letter-spacing:-0.04em; color:#fff;">Records<span style="color:var(--cyan); text-shadow:0 0 10px rgba(127,200,255,0.5)">.</span></span></div>
  <div><span class="meta">H1 / 32 / 300</span> &nbsp; <span style="font-family:var(--font-display); font-weight:300; font-size:32px; letter-spacing:-0.04em; color:#fff;">Operator<span style="color:var(--cyan)">.</span></span></div>
  <div><span class="meta">H2 / 28 / 300</span> &nbsp; <span style="font-family:var(--font-display); font-weight:300; font-size:28px; letter-spacing:-0.02em; color:#fff;">The Heavy Trunk</span></div>
</div>
</body>
</html>
