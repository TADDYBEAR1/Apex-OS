<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4 · 8 · 12 · 16 · 24 · 32 · 48" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: #000; padding: 24px; }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .bar { background: var(--cyan-dim); border-bottom: 2px solid var(--cyan); }
  .lbl { font-family: var(--font-body); font-size: 10px; color: var(--muted); margin-top: 8px; display: block; text-align: center; }
  .cell { text-align: center; }
</style>
</head>
<body>
<div class="row">
  <div class="cell"><div class="bar" style="width:4px; height:4px"></div><span class="lbl">1·4</span></div>
  <div class="cell"><div class="bar" style="width:8px; height:8px"></div><span class="lbl">2·8</span></div>
  <div class="cell"><div class="bar" style="width:12px; height:12px"></div><span class="lbl">3·12</span></div>
  <div class="cell"><div class="bar" style="width:16px; height:16px"></div><span class="lbl">4·16</span></div>
  <div class="cell"><div class="bar" style="width:24px; height:24px"></div><span class="lbl">6·24</span></div>
  <div class="cell"><div class="bar" style="width:32px; height:32px"></div><span class="lbl">8·32</span></div>
  <div class="cell"><div class="bar" style="width:48px; height:48px"></div><span class="lbl">12·48</span></div>
</div>
</body>
</html>
