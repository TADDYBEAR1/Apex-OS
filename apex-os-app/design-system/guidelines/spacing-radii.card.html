<!-- @dsCard group="Spacing" viewport="700x160" name="Corner radii" subtitle="6 · 10 · 16 · 24 · pill" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: #000; padding: 24px; }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .box { width: 84px; height: 84px; background: rgba(255,255,255,0.04); border: 1px solid var(--surface-border-light); }
  .lbl { font-family: var(--font-body); font-size: 11px; color: var(--muted); margin-top: 8px; display: block; text-align: center; }
  .cell { text-align: center; }
</style>
</head>
<body>
<div class="row">
  <div class="cell"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="lbl">xs · 6</span></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="lbl">sm · 10</span></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-md)"></div><span class="lbl">md · 16</span></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="lbl">lg · 24</span></div>
  <div class="cell"><div class="box" style="border-radius:var(--radius-pill)"></div><span class="lbl">pill · 999</span></div>
</div>
</body>
</html>
