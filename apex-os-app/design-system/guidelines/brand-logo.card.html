<!-- @dsCard group="Brand" viewport="700x220" name="Logo & app mark" subtitle="The Apex neon 'A' on deep black" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: #000; padding: 28px; background-image: radial-gradient(circle at 30% 30%, rgba(127,200,255,0.08), transparent 55%); }
  .row { display: flex; align-items: center; gap: 36px; }
  .tile { width: 120px; height: 120px; border-radius: 26px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .lockup { display: flex; align-items: center; gap: 16px; }
  .glyph { width: 56px; height: 56px; border-radius: 15px; border: 1px solid rgba(127,200,255,0.4); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 30px; color: var(--cyan); box-shadow: inset 0 0 18px rgba(127,200,255,0.15), 0 0 24px rgba(127,200,255,0.12); }
  .wordmark { font-family: var(--font-display); font-weight: 600; font-size: 28px; letter-spacing: 0.01em; }
  .wordmark small { display:block; font-family: var(--font-body); font-weight: 400; font-size: 10px; letter-spacing: 0.22em; color: var(--muted); text-transform: uppercase; margin-top: 3px; }
  .cap { font-family: var(--font-body); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
</style>
</head>
<body>
<div class="row">
  <div>
    <div class="cap">App icon</div>
    <div class="tile" style="background:#000; box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 0 40px rgba(127,200,255,0.12);">
      <img src="apex-logo.png" alt="Apex OS app icon" width="92" height="92" />
    </div>
  </div>
  <div>
    <div class="cap">Horizontal lockup</div>
    <div class="lockup">
      <div class="glyph">A</div>
      <div class="wordmark">Apex OS<small>Training Operating System</small></div>
    </div>
  </div>
</div>
</body>
</html>
