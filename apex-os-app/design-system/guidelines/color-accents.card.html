<!-- @dsCard group="Colors" viewport="700x150" name="Accents — Orange & Green" subtitle="Warning/heat & go/gains" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: #000; padding: 22px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; height: 96px; border-radius: var(--radius-md); display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; border: 1px solid var(--surface-border); }
  .name { font-family: var(--font-display); font-weight: 600; font-size: 12px; }
  .hex { font-family: var(--font-body); font-size: 11px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="background:#ff4d00; box-shadow: var(--orange-glow);"><span class="name" style="color:#fff">Orange</span><span class="hex" style="color:rgba(255,255,255,0.85)">#FF4D00 · --orange</span></div>
  <div class="sw" style="background:rgba(255,77,0,0.1)"><span class="name" style="color:var(--orange)">Orange Dim</span><span class="hex" style="color:var(--orange)">10% · --orange-dim</span></div>
  <div class="sw" style="background:#00ff88"><span class="name" style="color:#000">Green</span><span class="hex" style="color:rgba(0,0,0,0.7)">#00FF88 · --green</span></div>
  <div class="sw" style="background:rgba(0,255,136,0.1)"><span class="name" style="color:var(--green)">Green Dim</span><span class="hex" style="color:var(--green)">10% · --green-dim</span></div>
</div>
</body>
</html>
