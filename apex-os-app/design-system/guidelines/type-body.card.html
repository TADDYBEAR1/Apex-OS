<!-- @dsCard group="Type" viewport="700x180" name="Body & labels — Inter" subtitle="Prose, secondary text, wide-tracked caps labels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: #000; padding: 24px; }
  .meta { font-family: var(--font-body); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
<div style="display:flex; flex-direction:column; gap:14px;">
  <div><span class="meta">Caps label · Inter 500 · 0.15em</span><br>
    <span style="font-family:var(--font-body); font-size:11px; font-weight:500; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted);">Mission Control</span> &nbsp;
    <span style="font-family:var(--font-body); font-size:11px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--cyan);">Today's Mission</span>
  </div>
  <div><span class="meta">Body · Inter 300 · 15px</span><br>
    <span style="font-family:var(--font-body); font-weight:300; font-size:15px; color:var(--text);">Recovery is part of the protocol. Twenty seconds calibrates the day.</span>
  </div>
  <div><span class="meta">Secondary · Inter 300 · 13px</span><br>
    <span style="font-family:var(--font-body); font-weight:300; font-size:13px; color:var(--text-secondary);">Proceed with caution — cut top sets and keep RPE under 8.</span>
  </div>
</div>
</body>
</html>
