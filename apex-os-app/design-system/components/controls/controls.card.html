<!-- @dsCard group="Components" viewport="700x300" name="Controls" subtitle="Segmented control & in-session stepper" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { background: #000; padding: 28px; }
  .wrap { display: grid; grid-template-columns: 1fr 1.1fr; gap: 28px; align-items: start; }
  .cap { font-family: var(--font-body); font-size: 10px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 12px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { SegmentedControl, Stepper } = window.ApexOSDesignSystem_1864eb;
  const { useState } = React;
  function Demo() {
    const [view, setView] = useState('history');
    const [kg, setKg] = useState(40);
    return (
      <div className="wrap">
        <div>
          <span className="cap">Segmented control</span>
          <SegmentedControl
            value={view}
            onChange={setView}
            options={[{ key: 'history', label: 'History' }, { key: 'benchmarks', label: 'Benchmarks' }]}
          />
          <div style={{ height: '24px' }}></div>
          <SegmentedControl
            value={view}
            onChange={setView}
            options={[{ key: 'history', label: '30d' }, { key: 'benchmarks', label: '90d' }]}
          />
        </div>
        <div>
          <span className="cap">Stepper</span>
          <Stepper label="Flat DB Bench Press" value={kg} onChange={setKg} min={0} max={300} step={2.5} unit="kg" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
