<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { background: #000; padding: 28px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 22px; }
  .cap { font-family: var(--font-body); font-size: 10px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); width: 100%; margin-bottom: 2px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, IconButton } = window.ApexOSDesignSystem_1864eb;
  function Demo() {
    return (
      <div>
        <div className="row">
          <span className="cap">Variants</span>
          <Button variant="primary">Primary</Button>
          <Button variant="solid">Solid</Button>
          <Button variant="surface">Surface</Button>
          <Button variant="ghost">Ghost</Button>
        </div>
        <div className="row">
          <span className="cap">Sizes & states</span>
          <Button variant="primary" size="lg">Large</Button>
          <Button variant="primary" size="md">Medium</Button>
          <Button variant="primary" size="sm">Small</Button>
          <Button variant="primary" disabled>Disabled</Button>
        </div>
        <div className="row">
          <span className="cap">Icon buttons</span>
          <IconButton label="add" tone="primary">+</IconButton>
          <IconButton label="close" tone="muted">✕</IconButton>
          <IconButton label="delete" tone="danger">✕</IconButton>
          <IconButton label="add big" tone="primary" size={44}>+</IconButton>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
