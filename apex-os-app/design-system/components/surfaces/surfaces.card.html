<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { background: #000; padding: 28px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cap { font-family: var(--font-body); font-size: 10px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  .badges { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { GlassCard, Badge } = window.ApexOSDesignSystem_1864eb;
  function Demo() {
    return (
      <div className="grid">
        <GlassCard>
          <span className="cap">Static panel</span>
          <h3 style={{ fontSize: '20px', fontWeight: 300, marginTop: '8px', letterSpacing: '-0.02em' }}>The Heavy Trunk</h3>
          <p style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>6 exercises · 90 min</p>
          <div className="badges">
            <Badge tone="strength">Strength</Badge>
            <Badge tone="bodyweight">Bodyweight</Badge>
            <Badge tone="endurance">Endurance</Badge>
            <Badge tone="neutral">1RM</Badge>
          </div>
        </GlassCard>
        <GlassCard onClick={() => {}}>
          <span className="cap">Interactive · hover me</span>
          <h3 style={{ fontSize: '20px', fontWeight: 300, marginTop: '8px', letterSpacing: '-0.02em' }}>
            Today's Mission <span style={{ color: 'var(--cyan)' }}>→</span>
          </h3>
          <p style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>Tap to enter Focus Mode</p>
        </GlassCard>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
