<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apex OS — Direction Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" />
<style>
  html, body { margin: 0; }
  .phone { width: 390px; height: 800px; border-radius: 52px; padding: 11px;
    background: linear-gradient(150deg,#23262c,#0a0b0d 60%);
    box-shadow: 0 40px 90px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.3), inset 0 1px 1px rgba(255,255,255,.14); }
  .phone-screen { width: 100%; height: 100%; border-radius: 42px; overflow: hidden; position: relative; }
  .note { font-family: 'Inter',sans-serif; font-size: 13px; line-height: 1.5; color: #4b5563; max-width: 390px; margin: 0 auto; padding-top: 16px; text-align: center; }
  .note b { color: #111827; font-weight: 600; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="DirDaylight.jsx"></script>
<script type="text/babel" src="DirAurora.jsx"></script>
<script type="text/babel" src="DirPulse.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function Phone({ children }) {
    return <div className="phone"><div className="phone-screen">{children}</div></div>;
  }

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="dir" title="Mission Control — Direction Studies" subtitle="Three premium directions beyond the dark-cyan baseline. Same screen, three worlds.">
          <DCArtboard id="daylight" label="01 · Daylight — luminous lab (light)" width={440} height={910}>
            <Phone><window.DirDaylight /></Phone>
            <p className="note"><b>Bright & clinical.</b> White glass, ink type, one electric-cobalt accent and a readiness ring. Premium, calm, "not dark" — reads like a high-end medical instrument.</p>
          </DCArtboard>
          <DCArtboard id="aurora" label="02 · Aurora — iridescent spatial" width={440} height={910}>
            <Phone><window.DirAurora /></Phone>
            <p className="note"><b>Spatial & alive.</b> Frosted glass floating over a living aurora field; iridescent cyan→violet→pink accents. visionOS-grade depth — evolves the dark baseline upward.</p>
          </DCArtboard>
          <DCArtboard id="pulse" label="03 · Pulse — heat energy" width={440} height={910}>
            <Phone><window.DirPulse /></Phone>
            <p className="note"><b>Warm & kinetic.</b> Ember ground with a flame-gradient readiness ring as the hero. Data-as-art, exertion energy — distinctive and unmistakably about effort.</p>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
