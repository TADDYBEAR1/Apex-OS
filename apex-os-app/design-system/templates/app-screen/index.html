<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./ds-base.js"></script>
<style>
  html, body { height: 100%; }
  body {
    margin: 0; background: #000;

      radial-gradient(700px 600px at 85% 90%, rgba(153,0,255,0.07), transparent 55%);

    font-family: var(--font-body);

  .phone {
    position: relative; width: 390px; height: 800px; border-radius: 54px; padding: 12px;

<body>
<div id="root"></div>

    const { GlassCard, ProgressBar, StatReadout, ReadinessLight, BottomNav, Button } = DS;

  mount();
</script>
